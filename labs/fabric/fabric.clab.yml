name: fabric

topology:
  nodes:
    spine1:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/common/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spine1/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    spine2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/common/vtysh.conf:/etc/frr/vtysh.conf
        - configs/spine2/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    leaf1:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/common/vtysh.conf:/etc/frr/vtysh.conf
        - configs/common/setup-evpn.sh:/setup-evpn.sh
        - configs/leaf1/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sh /setup-evpn.sh 10.0.0.11
    leaf2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/common/vtysh.conf:/etc/frr/vtysh.conf
        - configs/common/setup-evpn.sh:/setup-evpn.sh
        - configs/leaf2/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sh /setup-evpn.sh 10.0.0.12

    host1:
      kind: linux
      image: alpine:3.20
      exec:
        - ip link set eth1 mtu 1500
        - ip addr add 192.168.10.11/24 dev eth1
    host2:
      kind: linux
      image: alpine:3.20
      exec:
        - ip link set eth1 mtu 1500
        - ip addr add 192.168.10.12/24 dev eth1

  links:
    # Underlay (Part 2)
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    # Host access ports (Part 3)
    - endpoints: ["leaf1:eth3", "host1:eth1"]
    - endpoints: ["leaf2:eth3", "host2:eth1"]
