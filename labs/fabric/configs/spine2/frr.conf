frr defaults datacenter
hostname spine2
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.2/32
!
interface eth1
 description to-leaf1
 ip address 10.1.2.0/31
!
interface eth2
 description to-leaf2
 ip address 10.1.2.2/31
!
ip prefix-list LOOPBACKS seq 10 permit 10.0.0.0/24 ge 32
!
route-map LOOPBACKS-IN permit 10
 match ip address prefix-list LOOPBACKS
!
route-map LOOPBACKS-OUT permit 10
 match ip address prefix-list LOOPBACKS
!
router bgp 65000
 bgp router-id 10.0.0.2
 neighbor LEAVES peer-group
 neighbor LEAVES remote-as external
 neighbor 10.1.2.1 peer-group LEAVES
 neighbor 10.1.2.3 peer-group LEAVES
 !
 address-family ipv4 unicast
  network 10.0.0.2/32
  neighbor LEAVES route-map LOOPBACKS-IN in
  neighbor LEAVES route-map LOOPBACKS-OUT out
  maximum-paths 4
 exit-address-family
!
router bgp 65000
 address-family l2vpn evpn
  neighbor LEAVES activate
  neighbor LEAVES attribute-unchanged next-hop
 exit-address-family
!
