frr defaults datacenter
hostname leaf1
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.11/32
!
interface eth1
 description to-spine1
 ip address 10.1.1.1/31
!
interface eth2
 description to-spine2
 ip address 10.1.2.1/31
!
ip prefix-list LOOPBACKS seq 10 permit 10.0.0.0/24 ge 32
ip prefix-list MY-LOOPBACK seq 10 permit 10.0.0.11/32
!
route-map LOOPBACKS-IN permit 10
 match ip address prefix-list LOOPBACKS
!
route-map LEAF-OUT permit 10
 match ip address prefix-list MY-LOOPBACK
!
router bgp 65001
 bgp router-id 10.0.0.11
 neighbor SPINES peer-group
 neighbor SPINES remote-as external
 neighbor 10.1.1.0 peer-group SPINES
 neighbor 10.1.2.0 peer-group SPINES
 !
 address-family ipv4 unicast
  network 10.0.0.11/32
  neighbor SPINES route-map LOOPBACKS-IN in
  neighbor SPINES route-map LEAF-OUT out
  maximum-paths 4
 exit-address-family
!
router bgp 65001
 address-family l2vpn evpn
  neighbor SPINES activate
  advertise-all-vni
  vni 10010
   route-target import 65000:10010
   route-target export 65000:10010
  exit-vni
 exit-address-family
!
